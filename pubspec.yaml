name: muslim_prayer_tracker
description: "A beautiful Islamic Prayer & Tasbeeh Counter app with offline support and clean architecture."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  signals_flutter: ^6.3.0
  flutter_hooks: ^0.20.5

  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1


  path_provider: ^2.1.5

  # Theme
  flex_color_scheme: ^8.0.2

  # Logging & Debugging
  talker_flutter: ^4.6.0

  # Utilities
  visibility_detector: ^0.4.0+2
  intl: ^0.20.0
  table_calendar: ^3.1.5

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.1
  # Prayer Times Calculation
  adhan: ^2.0.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Settings Storage
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0

  # Code Generation
# Code Generation
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Assets
  assets:
    - assets/images/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

